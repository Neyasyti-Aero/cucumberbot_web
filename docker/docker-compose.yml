name: cucumberbot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cucumberbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/cucumberbot
      DATABASE_SYNC_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/cucumberbot
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32-chars-min}
      ROSBRIDGE_URL: ${ROSBRIDGE_URL:-ws://rosbridge:9090}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      DEFAULT_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cucumberbot.local}
      DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal

  rosbridge:
    image: ros:noetic-ros-base
    restart: unless-stopped
    command: >
      bash -c "apt-get update -qq &&
               apt-get install -y ros-noetic-rosbridge-server &&
               source /opt/ros/noetic/setup.bash &&
               roslaunch rosbridge_server rosbridge_websocket.launch"
    ports:
      - "9090:9090"
    networks:
      - internal
    profiles:
      - demo

volumes:
  postgres_data:
  minio_data:

networks:
  internal:
    driver: bridge
