# CucumberBot Web — панель управления роботом.
# Положить в /home/fallback/caddy/ и подключить в Caddyfile:
#   import /etc/caddy/cucumberbot.conf
# TLS-сертификат Caddy выпустит сам. WebSocket (телеметрия, терминал) проксируется без доп. настроек.

ogurec.neyasyti.ru {
    encode gzip zstd

    reverse_proxy cucumberbot-web:80 {
        header_up X-Real-IP {remote_host}
    }

    # карты (PGM/PDF/картинки) бывают крупными
    request_body {
        max_size 50MB
    }

    header {
        Strict-Transport-Security "max-age=31536000"
        # внутренняя панель — поисковикам здесь делать нечего
        X-Robots-Tag "noindex, nofollow"
        -Server
    }
}
